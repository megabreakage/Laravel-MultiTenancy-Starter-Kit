services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: laravel-api-kit-app:latest
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  horizon:
    build:
      context: .
      dockerfile: docker/horizon/Dockerfile
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_healthy }

  scheduler:
    image: laravel-api-kit-app:latest
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      app: { condition: service_started }

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: ${DB_CENTRAL_DATABASE}
      MYSQL_USER: ${DB_CENTRAL_USERNAME}
      MYSQL_PASSWORD: ${DB_CENTRAL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
  meili_data:
